<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiroTalk Glass</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        /* Utility for hidden elements logic */
        .hidden { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen animated-bg text-white selection:bg-pink-500 selection:text-white">

    <!-- Join Room Overlay -->
    <div id="join-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-3xl transition-all duration-500">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-md flex flex-col gap-6 relative overflow-hidden">
            <!-- decorative mesh behind -->
            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-blue-500/20 to-purple-500/20 pointer-events-none"></div>
            
            <div class="relative z-10 flex flex-col items-center gap-2">
                <div class="glass-panel-light p-4 rounded-2xl mb-2">
                    <i class="fa-solid fa-layer-group text-3xl text-blue-400"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wide">MiroTalk <span class="text-sm font-normal opacity-70">Glass</span></h1>
                <p class="text-sm text-gray-400">Enter your details to join</p>
            </div>
    
            <div class="relative z-10 flex flex-col gap-4">
                <div>
                    <label class="text-xs font-medium text-gray-400 ml-1 mb-1 block">Display Name</label>
                    <input id="displayName" type="text" placeholder="Your Name" class="glass-input w-full rounded-xl py-3 px-4 focus:ring-2 focus:ring-blue-500/50">
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-400 ml-1 mb-1 block">Room ID</label>
                    <input id="roomId" type="text" placeholder="room-id" class="glass-input w-full rounded-xl py-3 px-4 focus:ring-2 focus:ring-blue-500/50">
                </div>
                <button id="joinBtn" class="mt-2 w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-lg shadow-blue-500/25 transition-all active:scale-95">
                    Join Room
                </button>
            </div>
        </div>
    </div>

    <!-- Audio Unlock Button (Hidden by default) -->
    <button id="enableAudioBtn" style="display:none;" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[200] bg-red-500 hover:bg-red-400 text-white px-6 py-3 rounded-full shadow-xl font-medium items-center gap-2 transition-all animate-pulse">
        <i class="fa-solid fa-volume-high"></i>
        <span>Click to Enable Audio</span>
    </button>

    <!-- App Container -->
    <div class="relative w-full h-full flex flex-col p-4 md:p-6 gap-4">

        <!-- Header / Status Bar -->
        <header class="flex justify-between items-center z-10 shrink-0 px-2">
            <div class="flex items-center gap-3">
                <div class="glass-panel-light p-2 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-layer-group text-blue-400"></i>
                </div>
                <div>
                    <h1 class="font-semibold text-lg tracking-wide">MiroTalk <span class="text-xs font-light opacity-70 bg-white/10 px-2 py-0.5 rounded-full ml-2">MVP</span></h1>
                    <div class="flex items-center gap-2 text-xs text-gray-400">
                        <span id="status" class="text-gray-300">Disconnected</span>
                    </div>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex gap-3">
                <button class="glass-panel-light h-10 w-10 rounded-full flex items-center justify-center hover:bg-white/20 transition-all btn-hover" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div class="glass-panel px-4 py-2 rounded-full flex items-center gap-3">
                    <span class="text-sm font-medium">04:20</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex gap-4 overflow-hidden relative">
            
            <!-- Video Grid Area -->
            <div id="video-grid" class="flex-1 flex flex-col gap-4 relative transition-all duration-300 ease-in-out">
                
                <!-- Main Speaker / Remote Videos Container -->
                <div class="relative flex-1 glass-panel rounded-3xl overflow-hidden group shadow-2xl p-2">
                    <!-- This is where we inject remote videos -->
                    <div id="remoteVideos"></div>
                    
                    <!-- Self View (Overlay) -->
                    <div id="localTile" class="absolute bottom-4 left-4 w-48 rounded-2xl overflow-hidden glass-panel border-2 border-blue-500/30 z-20 shadow-2xl transition-all hover:scale-105">
                        <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover aspect-video bg-black/50"></video>
                        <span class="absolute bottom-2 left-2 text-xs bg-black/50 px-2 py-0.5 rounded-lg">You</span>
                        <!-- Fullscreen button for local tile -->
                        <button id="localFsBtn" class="tile-fs"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </div>

            <!-- Side Panel (Chat/Info) - Toggleable -->
            <aside id="side-panel" class="w-80 glass-panel rounded-3xl flex flex-col transition-all duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] translate-x-0 ml-2">
                
                <!-- Panel Tabs -->
                <div class="flex p-1 m-3 bg-black/20 rounded-xl">
                    <button class="flex-1 py-1.5 rounded-lg text-sm font-medium bg-white/10 shadow-sm transition-all text-white">Chat</button>
                    <button class="flex-1 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-all">People</button>
                </div>

                <!-- Chat Area -->
                <div id="chatLog" class="flex-1 overflow-y-auto p-4 space-y-4 glass-scroll">
                    <!-- Chat messages injected here -->
                </div>

                <!-- Chat Input -->
                <div class="p-4 pt-2 border-t border-white/5">
                    <div class="relative">
                        <input type="text" id="chatInput" placeholder="Type a message..." class="w-full glass-input rounded-xl py-3 pl-4 pr-10 text-sm placeholder-gray-400 focus:ring-2 focus:ring-blue-500/50">
                        <button id="sendChat" class="absolute right-2 top-2 h-7 w-7 bg-blue-500 rounded-lg flex items-center justify-center text-white hover:bg-blue-400 transition-colors">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Floating Control Dock (Bottom Center) -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-50">
            <div class="glass-dock px-6 py-3 rounded-full flex items-center gap-4 sm:gap-6 shadow-2xl transition-all hover:scale-105 duration-300">
                
                <!-- Mic Toggle -->
                <button id="toggleMic" class="h-12 w-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all btn-hover group relative" title="Mute">
                    <!-- Icons handled by init.js class switching, but we set defaults here -->
                    <i class="fa-solid fa-microphone text-lg group-hover:scale-110 transition-transform icon on"></i>
                    <i class="fa-solid fa-microphone-slash text-lg group-hover:scale-110 transition-transform icon off" style="display:none"></i>
                </button>
                
                <!-- Cam Toggle -->
                <button id="toggleCam" class="h-12 w-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all btn-hover group relative" title="Stop Video">
                    <i class="fa-solid fa-video text-lg group-hover:scale-110 transition-transform icon on"></i>
                    <i class="fa-solid fa-video-slash text-lg group-hover:scale-110 transition-transform icon off" style="display:none"></i>
                </button>

                <!-- Share Screen (Primary Action) -->
                <!-- ID shareToggle is used by init.js to trigger hidden share buttons -->
                <button id="shareToggle" class="h-14 w-14 rounded-2xl bg-blue-600/80 hover:bg-blue-500 flex items-center justify-center text-white transition-all btn-hover shadow-lg shadow-blue-500/30 group relative mx-2">
                    <i class="fa-solid fa-arrow-up-from-bracket text-xl group-hover:-translate-y-1 transition-transform icon share"></i>
                    <i class="fa-solid fa-xmark text-xl group-hover:-translate-y-1 transition-transform icon stop" style="display:none"></i>
                </button>

                <!-- Chat Toggle (UI Only) -->
                <button onclick="toggleChat()" class="h-12 w-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all btn-hover group relative on" id="chatToggleBtn">
                    <div class="relative">
                        <i class="fa-regular fa-comment-dots text-lg group-hover:scale-110 transition-transform icon on"></i>
                        <i class="fa-solid fa-comment-slash text-lg group-hover:scale-110 transition-transform icon off" style="display:none"></i>
                    </div>
                </button>

                <div class="w-px h-8 bg-white/10 mx-1"></div>

                <!-- Leave Button -->
                <button id="leaveBtn" class="h-12 w-12 rounded-full bg-red-500/80 hover:bg-red-600 flex items-center justify-center text-white transition-all btn-hover shadow-lg shadow-red-500/20" title="Leave">
                    <i class="fa-solid fa-phone-slash text-lg"></i>
                </button>

            </div>
        </div>

    </div>

    <!-- Hidden elements for legacy init.js logic -->
    <div style="display:none;">
        <button id="shareScreen">Share Screen</button>
        <button id="stopShare">Stop Share</button>
    </div>

    <!-- UI Scripts -->
    <script>
        // Toggle Chat Logic
        const sidePanel = document.getElementById('side-panel');
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const videoGrid = document.getElementById('video-grid');
        let isChatOpen = true;

        function toggleChat() {
            if (isChatOpen) {
                // Close Chat
                sidePanel.style.width = '0px';
                sidePanel.style.opacity = '0';
                sidePanel.style.marginLeft = '0';
                sidePanel.style.padding = '0';
                if(chatToggleBtn) {
                    chatToggleBtn.classList.remove('on');
                    chatToggleBtn.classList.add('off');
                }
            } else {
                // Open Chat
                sidePanel.style.width = '20rem'; // w-80 equivalent
                sidePanel.style.opacity = '1';
                sidePanel.style.marginLeft = '0.5rem';
                sidePanel.classList.add('p-0'); 
                if(chatToggleBtn) {
                    chatToggleBtn.classList.remove('off');
                    chatToggleBtn.classList.add('on');
                }
            }
            isChatOpen = !isChatOpen;
        }
        
        // Initial chat state adjustments if needed
    </script>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app/main.js" type="module"></script>
</body>
</html>
