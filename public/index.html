<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>MiroTalk WebRTC MVP</title>
  <style>
    /* Default to Dark appearance (matches current UI); add Light via media query */
    :root {
      /* Dark appearance tokens (approx iOS) */
      --bg: #000000;
      --panel: rgba(28,28,30,0.6);
      --panel-border: rgba(235,235,245,0.18);
      --input-bg: rgba(118,118,128,0.24);
      --text: #ffffff;
      --muted: #9ca3af;
      --primary: #0a84ff;      /* iOS system blue */
      --primary-600: #409cff;
      --secondary: rgba(118,118,128,0.24);
      --secondary-600: rgba(118,118,128,0.32);
      --danger: #ff3b30;
      --danger-600: #d70015;
      --success: #34c759;
      --success-600: #30b44f;
      --warning: #ffd60a;

      /* Shape & spacing */
      --radius: 12px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;

      /* Safe areas */
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --panel: rgba(255,255,255,0.72);
        --panel-border: rgba(60,60,67,0.29);
        --input-bg: rgba(118,118,128,0.12);
        --text: #1c1c1e;
        --muted: #6b7280;
        --primary: #0a84ff;
        --primary-600: #0060df;
        --secondary: rgba(118,118,128,0.18);
        --secondary-600: rgba(118,118,128,0.24);
        --danger: #ff3b30;
        --danger-600: #c60b00;
        --success: #34c759;
        --success-600: #30b44f;
        --warning: #ff9f0a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--text);
      padding-top: max(0px, var(--safe-top));
      padding-bottom: max(0px, var(--safe-bottom));
    }

    header {
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: var(--panel);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--panel-border);
    }

    main { display: grid; grid-template-columns: 320px 1fr; gap: 12px; padding: 12px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 12px;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }

    input, button, textarea {
      width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px 12px; border-radius: var(--radius);
      border: 1px solid var(--panel-border); background: var(--input-bg); color: var(--text);
      min-height: 44px; /* HIG recommended touch target */
    }

    button {
      cursor: pointer; background: var(--primary); border-color: var(--primary);
      transition: background-color .18s ease, border-color .18s ease, transform .06s ease, box-shadow .18s ease, opacity .2s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 0 0 rgba(0,0,0,0);
      user-select: none;
    }
    button:hover { background: var(--primary-600); border-color: var(--primary-600); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(20%); }

    /* Focus styles */
    :focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; border-radius: calc(var(--radius) - 2px); }

    /* Variants */
    button.secondary { background: var(--secondary); border-color: var(--secondary-600); }
    button.secondary:hover { background: var(--secondary-600); }

    button.danger { background: var(--danger); border-color: var(--danger-600); }
    button.danger:hover { background: var(--danger-600); }

    /* State colors */
    button.on { background: var(--success); border-color: var(--success-600); }
    button.on:hover { background: var(--success-600); }

    button.off { background: var(--secondary); border-color: var(--secondary-600); }
    button.off:hover { background: var(--secondary-600); }

    /* Attention/pulse (e.g., screen sharing active) */
    .pulse {
      animation: pulseGlow 1.5s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(16,185,129,0.6);
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
      70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .row { display: flex; gap: 8px; }
    video { width: 100%; background: var(--input-bg); border-radius: var(--radius); }
    .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .tile { display: flex; flex-direction: column; gap: 6px; }
    .tile video { border: 1px solid var(--panel-border); }
    .tile-actions { display: flex; justify-content: flex-end; }
    .fs-btn { width: 36px; min-width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }
    .fs-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Bottom fixed toolbar */
    .toolbar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(12px + var(--safe-bottom));
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: calc(var(--radius) + 4px);
      padding: 10px; backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex; gap: 10px; align-items: center;
      z-index: 50;
    }
    .icon-btn { width: 52px; height: 52px; padding: 0; display: grid; place-items: center; }
    .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
    /* Swap icon variants based on button state */
    .icon-btn .icon-off { display: none; }
    .icon-btn.off .icon-on { display: none; }
    .icon-btn.off .icon-off { display: inline; }
    /* Share button width */
    .share-btn { min-width: 220px; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 12px; background: var(--secondary); border-radius: 999px; }
    .controls { display: none; }
    .chat { height: 200px; overflow: auto; background: var(--input-bg); padding: 8px; border-radius: 6px; }
    .muted { opacity: 0.65; }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* Ensure content isn't hidden behind the fixed toolbar */
    main { padding-bottom: calc(84px + var(--safe-bottom)); }

    /* Red pulse when in danger state (Stop Sharing) */
    .danger.pulse { box-shadow: 0 0 0 0 rgba(255,59,48,0.6); animation-name: pulseGlowDanger; }
    @keyframes pulseGlowDanger {
      0% { box-shadow: 0 0 0 0 rgba(255,59,48,0.45); }
      70% { box-shadow: 0 0 0 10px rgba(255,59,48,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); }
    }

    /* Small screens: tighten controls */
    @media (max-width: 380px) {
      .icon-btn { width: 46px; height: 46px; }
      .share-btn { min-width: 160px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="row" style="align-items:center; justify-content: space-between;">
      <div>
        <strong>MiroTalk</strong> <span class="badge">MVP</span>
      </div>
      <div id="status" role="status" aria-live="polite">Disconnected</div>
    </div>
  </header>
  <main role="main">
    <section class="panel">
      <h3>Join Room</h3>
      <label for="displayName">Display Name</label>
      <input id="displayName" placeholder="Your name" autocomplete="name" />
      <label for="roomId">Room ID</label>
      <input id="roomId" placeholder="e.g. demo" autocomplete="off" />
      <div class="row" style="margin-top:8px;">
        <button id="joinBtn">Join</button>
        <button id="leaveBtn" class="danger">Leave</button>
      </div>

      <h3 style="margin-top:16px;">Chat</h3>
      <div id="chatLog" class="chat" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="row" style="margin-top:6px;">
        <input id="chatInput" placeholder="Type a message..." aria-label="Chat message" />
        <button id="sendChat" class="secondary" style="width:auto;">Send</button>
      </div>
    </section>

    <section class="panel">
      <h3>Call</h3>
      <label id="remotesLabel" style="margin-top:12px;">Participants</label>
      <div class="row" style="margin:6px 0; align-items:center;">
        <button id="enableAudioBtn" class="secondary" style="width:auto; display:none;">Enable Audio</button>
        <span id="enableAudioHint" style="font-size:12px; color:#9ca3af; display:none;">Click to allow sound on this page (desktop autoplay)</span>
      </div>
      <div id="remoteVideos" class="videos" role="region" aria-labelledby="remotesLabel">
        <div id="localTile" class="tile">
          <video id="localVideo" autoplay playsinline muted aria-label="Local video preview"></video>
          <div class="tile-actions">
            <button id="fs-local" class="secondary fs-btn" title="Fullscreen" aria-label="Fullscreen" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 3H3v6M15 3h6v6M21 15v6h-6M9 21H3v-6" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom fixed toolbar -->
  <div class="toolbar" role="toolbar" aria-label="Call controls">
    <button id="toggleCam" class="icon-btn off" title="Toggle camera" aria-label="Toggle camera" aria-pressed="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <!-- Camera icons: on/off -->
        <g class="icon-on">
          <path d="M15 10l6-4v12l-6-4" />
          <rect x="3" y="6" width="12" height="12" rx="2" ry="2" />
        </g>
        <g class="icon-off">
          <path d="M15 10l6-4v12l-6-4" />
          <rect x="3" y="6" width="12" height="12" rx="2" ry="2" />
          <!-- Slash -->
          <path d="M3 21L21 3" />
        </g>
      </svg>
    </button>
    <button id="toggleMic" class="icon-btn off" title="Toggle microphone" aria-label="Toggle microphone" aria-pressed="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <!-- Microphone icons: on/off -->
        <g class="icon-on">
          <path d="M12 3a4 4 0 00-4 4v5a4 4 0 108 0V7a4 4 0 00-4-4z" />
          <path d="M19 11a7 7 0 01-14 0" />
          <path d="M12 18v3" />
        </g>
        <g class="icon-off">
          <path d="M12 3a4 4 0 00-4 4v5a4 4 0 108 0V7a4 4 0 00-4-4z" />
          <path d="M19 11a7 7 0 01-14 0" />
          <path d="M12 18v3" />
          <!-- Slash -->
          <path d="M3 21L21 3" />
        </g>
      </svg>
    </button>
    <button id="shareToggle" class="share-btn" title="Share your screen" aria-label="Share your screen" type="button">
      <span style="display:inline-flex; gap:8px; align-items:center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- Monitor icon -->
          <rect x="3" y="4" width="18" height="12" rx="2" ry="2" />
          <path d="M8 20h8" />
        </svg>
        <span id="shareLabel">Share</span>
      </span>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app/main.js" type="module"></script>
</body>
</html>
