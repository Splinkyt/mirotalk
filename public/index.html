<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiroTalk WebRTC MVP</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 12px 16px; background: #111827; border-bottom: 1px solid #1f2937; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 12px; padding: 12px; }
    .panel { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; }
    label { display: block; font-size: 12px; color: #9ca3af; margin-top: 8px; }
    input, button, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; border-radius: 6px; border: 1px solid #374151; background: #0b1220; color: #e5e7eb; }
    button { cursor: pointer; background: #1d4ed8; border-color: #1d4ed8; }
    button.secondary { background: #374151; border-color: #4b5563; }
    button.danger { background: #b91c1c; border-color: #b91c1c; }
    .row { display: flex; gap: 8px; }
    video { width: 100%; background: #0b1220; border-radius: 8px; }
    .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 12px; background: #374151; border-radius: 999px; }
    .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
    .chat { height: 200px; overflow: auto; background: #0b1220; padding: 8px; border-radius: 6px; }
    .muted { opacity: 0.65; }
  </style>
</head>
<body>
  <header>
    <div class="row" style="align-items:center; justify-content: space-between;">
      <div>
        <strong>MiroTalk</strong> <span class="badge">MVP</span>
      </div>
      <div id="status">Disconnected</div>
    </div>
  </header>
  <main>
    <section class="panel">
      <h3>Join Room</h3>
      <label>Display Name</label>
      <input id="displayName" placeholder="Your name" />
      <label>Room ID</label>
      <input id="roomId" placeholder="e.g. demo" />
      <div class="row" style="margin-top:8px;">
        <button id="joinBtn">Join</button>
        <button id="leaveBtn" class="danger">Leave</button>
      </div>

      <h3 style="margin-top:16px;">Chat</h3>
      <div id="chatLog" class="chat"></div>
      <div class="row" style="margin-top:6px;">
        <input id="chatInput" placeholder="Type a message..." />
        <button id="sendChat" class="secondary" style="width:auto;">Send</button>
      </div>
    </section>

    <section class="panel">
      <h3>Call</h3>
      <div class="row">
        <div style="flex:1;">
          <label>Local</label>
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="controls">
            <button id="toggleCam">Toggle Cam</button>
            <button id="toggleMic">Toggle Mic</button>
            <button id="shareScreen">Share Screen</button>
            <button id="stopShare" class="secondary">Stop Share</button>
          </div>
        </div>
      </div>
      <label style="margin-top:12px;">Remotes</label>
      <div id="remoteVideos" class="videos"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/main.js" type="module"></script>
</body>
</html>
