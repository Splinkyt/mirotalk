<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>MiroTalk WebRTC MVP</title>
  <style>
    /* Default to Dark appearance (matches current UI); add Light via media query */
    :root {
      /* Dark appearance tokens (approx iOS) */
      --bg: #000000;
      --panel: rgba(28,28,30,0.6);
      --panel-border: rgba(235,235,245,0.18);
      --input-bg: rgba(118,118,128,0.24);
      --text: #ffffff;
      --muted: #9ca3af;
      --primary: #0a84ff;      /* iOS system blue */
      --primary-600: #409cff;
      --secondary: rgba(118,118,128,0.24);
      --secondary-600: rgba(118,118,128,0.32);
      --danger: #ff3b30;
      --danger-600: #d70015;
      --success: #34c759;
      --success-600: #30b44f;
      --warning: #ffd60a;

      /* Shape & spacing */
      --radius: 12px;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;

      /* Safe areas */
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --panel: rgba(255,255,255,0.72);
        --panel-border: rgba(60,60,67,0.29);
        --input-bg: rgba(118,118,128,0.12);
        --text: #1c1c1e;
        --muted: #6b7280;
        --primary: #0a84ff;
        --primary-600: #0060df;
        --secondary: rgba(118,118,128,0.18);
        --secondary-600: rgba(118,118,128,0.24);
        --danger: #ff3b30;
        --danger-600: #c60b00;
        --success: #34c759;
        --success-600: #30b44f;
        --warning: #ff9f0a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--text);
      padding-top: max(0px, var(--safe-top));
      padding-bottom: max(0px, var(--safe-bottom));
    }

    header {
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: var(--panel);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--panel-border);
    }

    main { display: grid; grid-template-columns: 320px 1fr; gap: 12px; padding: 12px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 12px;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }

    input, button, textarea {
      width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px 12px; border-radius: var(--radius);
      border: 1px solid var(--panel-border); background: var(--input-bg); color: var(--text);
      min-height: 44px; /* HIG recommended touch target */
    }

    button {
      cursor: pointer; background: var(--primary); border-color: var(--primary);
      transition: background-color .18s ease, border-color .18s ease, transform .06s ease, box-shadow .18s ease, opacity .2s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 0 0 rgba(0,0,0,0);
      user-select: none;
    }
    button:hover { background: var(--primary-600); border-color: var(--primary-600); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(20%); }

    /* Focus styles */
    :focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; border-radius: calc(var(--radius) - 2px); }

    /* Variants */
    button.secondary { background: var(--secondary); border-color: var(--secondary-600); }
    button.secondary:hover { background: var(--secondary-600); }

    button.danger { background: var(--danger); border-color: var(--danger-600); }
    button.danger:hover { background: var(--danger-600); }

    /* State colors */
    button.on { background: var(--success); border-color: var(--success-600); }
    button.on:hover { background: var(--success-600); }

    button.off { background: var(--secondary); border-color: var(--secondary-600); }
    button.off:hover { background: var(--secondary-600); }

    /* Attention/pulse (e.g., screen sharing active) */
    .pulse {
      animation: pulseGlow 1.5s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(16,185,129,0.6);
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.45); }
      70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .row { display: flex; gap: 8px; }
    video { width: 100%; background: var(--input-bg); border-radius: var(--radius); }
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; align-items: start; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 12px; background: var(--secondary); border-radius: 999px; }
    .controls { display: none; }
    .chat { height: 200px; overflow: auto; background: var(--input-bg); padding: 8px; border-radius: 6px; }
    .muted { opacity: 0.65; }

    /* Video tile with per-tile fullscreen button */
    .video-tile { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--input-bg); aspect-ratio: 16 / 9; }
    .video-tile video { display: block; border-radius: 0; width: 100%; height: 100%; object-fit: cover; }
    .tile-fs {
      position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px;
      border-radius: 10px; background: var(--secondary); border-color: var(--secondary-600);
      display: inline-flex; align-items: center; justify-content: center; padding: 0; min-height: 36px; width: 36px;
    }
    .tile-fs:hover { background: var(--secondary-600); }

    /* Bottom, full-width call toolbar */
    .call-toolbar-wrap {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      padding: 12px max(12px, env(safe-area-inset-left)) calc(12px + var(--safe-bottom)) max(12px, env(safe-area-inset-right));
      pointer-events: none;
    }
    .call-toolbar {
      max-width: 960px; margin: 0 auto; pointer-events: auto;
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: calc(var(--radius) + 8px);
      padding: 10px; display: flex; gap: 12px; justify-content: center;
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .btn-icon {
      width: 56px; height: 56px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
    }
    .btn-icon svg { width: 26px; height: 26px; }
    /* icon state toggling */
    .btn-icon .icon { display: none; }
    .btn-icon.on .icon.on, .btn-icon.off .icon.off { display: inline; }
    #shareToggle .icon.share { display: inline; }
    #shareToggle.is-sharing .icon.share { display: none; }
    #shareToggle.is-sharing .icon.stop { display: inline; }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="row" style="align-items:center; justify-content: space-between;">
      <div>
        <strong>MiroTalk</strong> <span class="badge">MVP</span>
      </div>
      <div id="status" role="status" aria-live="polite">Disconnected</div>
    </div>
  </header>
  <main role="main">
    <section class="panel">
      <h3>Join Room</h3>
      <label for="displayName">Display Name</label>
      <input id="displayName" placeholder="Your name" autocomplete="name" />
      <label for="roomId">Room ID</label>
      <input id="roomId" placeholder="e.g. demo" autocomplete="off" />
      <div class="row" style="margin-top:8px;">
        <button id="joinBtn">Join</button>
        <button id="leaveBtn" class="danger">Leave</button>
      </div>

      <h3 style="margin-top:16px;">Chat</h3>
      <div id="chatLog" class="chat" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="row" style="margin-top:6px;">
        <input id="chatInput" placeholder="Type a message..." aria-label="Chat message" />
        <button id="sendChat" class="secondary" style="width:auto;">Send</button>
      </div>
    </section>

    <section class="panel">
      <h3>Call</h3>
      <!-- Hidden legacy share controls kept for logic reuse -->
      <div style="display:none;">
        <button id="shareScreen">Share Screen</button>
        <button id="stopShare">Stop Share</button>
      </div>
      <label id="participantsLabel" style="margin-top:12px;">Participants</label>
      <div class="row" style="margin:6px 0; align-items:center;">
        <button id="enableAudioBtn" class="secondary" style="width:auto; display:none;">Enable Audio</button>
        <span id="enableAudioHint" style="font-size:12px; color:#9ca3af; display:none;">Click to allow sound on this page (desktop autoplay)</span>
      </div>
      <div id="remoteVideos" class="videos" role="region" aria-labelledby="participantsLabel">
        <div class="video-tile" id="localTile">
          <video id="localVideo" autoplay playsinline muted aria-label="Local video preview"></video>
          <button class="tile-fs" id="localFsBtn" aria-label="Fullscreen" title="Fullscreen">
            <!-- Fullscreen icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3H5a2 2 0 0 0-2 2v4"></path>
              <polyline points="9 3 9 9 3 9"></polyline>
              <path d="M15 21h4a2 2 0 0 0 2-2v-4"></path>
              <polyline points="15 21 15 15 21 15"></polyline>
              <path d="M21 9V5a2 2 0 0 0-2-2h-4"></path>
              <polyline points="15 9 21 9 21 3"></polyline>
              <path d="M3 15v4a2 2 0 0 0 2 2h4"></path>
              <polyline points="3 15 9 15 9 21"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom toolbar (full-width) -->
  <div class="call-toolbar-wrap" role="group" aria-label="Call controls">
    <div class="call-toolbar">
      <button id="toggleCam" class="btn-icon off" aria-pressed="false" aria-label="Toggle camera" title="Toggle camera">
        <!-- camera on -->
        <svg class="icon on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15V9a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2z"></path>
          <polygon points="16 12 22 15 22 9 16 12"></polygon>
        </svg>
        <!-- camera off -->
        <svg class="icon off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 1l22 22"></path>
          <path d="M16 12l5 3V9l-5 3z"></path>
          <path d="M7 7h9a2 2 0 0 1 2 2v6"></path>
          <path d="M3 3h2a2 2 0 0 1 2 2v9"></path>
          <rect x="3" y="9" width="10" height="8" rx="2"></rect>
        </svg>
      </button>

      <button id="toggleMic" class="btn-icon off" aria-pressed="false" aria-label="Toggle microphone" title="Toggle microphone">
        <!-- mic on -->
        <svg class="icon on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 1a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"></path>
          <path d="M19 10a7 7 0 0 1-14 0"></path>
          <line x1="12" y1="17" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <!-- mic off -->
        <svg class="icon off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M15 11V4a3 3 0 0 0-6 0v3"></path>
          <path d="M9 10v1a3 3 0 0 0 5.12 2.12"></path>
          <path d="M19 10a7 7 0 0 1-14 0"></path>
          <line x1="12" y1="17" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <button id="shareToggle" class="btn-icon" aria-label="Share screen" title="Share screen">
        <!-- share icon -->
        <svg class="icon share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="14" rx="2"></rect>
          <path d="M12 8v6"></path>
          <path d="M9 11l3-3 3 3"></path>
        </svg>
        <!-- stop share icon -->
        <svg class="icon stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
          <rect x="3" y="4" width="18" height="14" rx="2"></rect>
          <rect x="9" y="9" width="6" height="6"></rect>
        </svg>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app/main.js" type="module"></script>
</body>
</html>
